<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DATA-LIZ MODULE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 20'%3E%3Crect x='3' y='1' width='24' height='18' rx='4' fill='%232f63d8'/%3E%3Crect x='3' y='14' width='24' height='3' fill='%23f07a1a'/%3E%3Crect x='8' y='5' width='3' height='5' rx='1' fill='%23f07a1a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b1a3d; --soft:#4a5878; --line:#cdd6e6; --paper:#e4ebf6; --panel:#ffffff;
  --cobalt:#1f4fbf; --cobalt-d:#16398c; --orange:#ff6a13; --orange-d:#d9560a;
  --gnd:#138a47; --gnd-bg:#e3f6ea; --open:#8a94a8; --red:#d4372a;
  --r-s:6px; --r-l:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#eef2fb; --soft:#a6b2cc; --line:#2b3754; --paper:#0a1224; --panel:#131d35; --gnd-bg:#123a26; --open:#6f7b95; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.45 "Archivo","Segoe UI",system-ui,Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.brand{background:var(--cobalt);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:12px 18px}
.mark{display:flex;flex-direction:column;line-height:1}
.mark b{font-weight:800;font-stretch:112%;font-size:26px;letter-spacing:1.5px;color:var(--orange)}
.mark span{font-weight:700;font-size:13px;letter-spacing:3px;margin-top:4px}
.grow{flex:1}
.mark .bus{font-weight:600;font-size:12px;letter-spacing:1.5px;margin-top:5px;color:#fff}
.mark .bus i{font-style:normal;padding:0 4px}
.mark .bus em{font-style:normal;padding:1px 4px;border-radius:4px}
.mark .bus em.act{animation:busact .5s steps(2) infinite}
@keyframes busact{0%{background:#3ddc84;color:#06301a;box-shadow:0 0 10px #3ddc84}50%{background:transparent;color:#fff;box-shadow:none}}
@media (prefers-reduced-motion: reduce){.mark .bus em.act{animation:none;background:#3ddc84;color:#06301a}}
.lang{background:rgba(255,255,255,.12);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:var(--r-s);min-height:46px;padding:6px 10px;font-weight:700}
.lang option{color:#0e1f44}
.net{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:999px;padding:6px 14px 6px 8px;font-weight:600;max-width:100%}
.led{width:18px;height:18px;border-radius:50%;background:#5b6b8f;flex:none}
.led.g250{background:#3ddc84;box-shadow:0 0 12px #3ddc84}.led.b500{background:#4c9bff;box-shadow:0 0 12px #4c9bff}.led.p666{background:#b77bff;box-shadow:0 0 12px #b77bff}
.led.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.led.blink{animation:none;opacity:.6}}
.btn{border:0;border-radius:var(--r-s);padding:11px 18px;font-weight:700;min-height:46px}
.btn.primary{background:var(--orange);color:#fff}.btn.primary:hover{background:var(--orange-d)}
.btn.ghost{background:transparent;border:2px solid var(--line)}.btn.ghost:hover{border-color:var(--cobalt)}
.btn.small{padding:7px 12px;min-height:40px;font-size:14px}
.btn.danger{background:transparent;border:2px solid var(--red);color:var(--red)}
.btn.on{background:var(--gnd);color:#fff;border-color:var(--gnd)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.brand .btn.ghost{border-color:rgba(255,255,255,.5);color:#fff}
nav{display:flex;gap:4px;padding:0 12px;background:var(--cobalt-d);overflow-x:auto}
nav button{background:none;border:0;color:#cdd8f5;padding:14px 16px;font-weight:700;border-bottom:4px solid transparent;white-space:nowrap;display:inline-flex;gap:8px;align-items:center;min-height:52px}
nav button[aria-selected="true"]{color:#fff;border-bottom-color:var(--orange)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1180px;margin:0 auto;padding:18px 14px 60px}
section[hidden]{display:none}
h2{font-weight:800;font-stretch:108%;font-size:24px;margin:4px 0}
h3{font-size:19px;margin:0 0 8px}
.lede{color:var(--soft);margin:0 0 16px;max-width:72ch}
.notice{background:var(--panel);border-left:5px solid var(--orange);padding:14px 16px;border-radius:var(--r-s);margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;margin-bottom:16px}
.card.tbl{padding:4px 2px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{color:var(--soft);font-weight:700;font-size:13px}
td.hex{font-family:"Cascadia Mono",Consolas,monospace;font-size:13px}
td small{color:var(--soft)}
tr.switchy td:first-child{box-shadow:inset 4px 0 0 var(--orange)}
tr.chg td{animation:chg 3s ease-out}@keyframes chg{0%{background:#ffe27a}100%{background:transparent}}
tr.flash td{animation:fl 1.2s ease-out}@keyframes fl{from{background:#fff1c2}to{background:transparent}}
@media (prefers-reduced-motion: reduce){tr.chg td,tr.flash td{animation:none}}
.chg-b{color:#fff;background:var(--orange);border-radius:3px;padding:0 2px}
select,input[type=text],input[type=number]{border:2px solid var(--line);border-radius:var(--r-s);padding:9px 10px;background:var(--panel);min-height:46px}
/* Salidas */
.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pin{background:var(--panel);border:2px solid var(--line);border-radius:var(--r-l);padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.pin.gnd{border-color:var(--gnd);background:var(--gnd-bg)}
.pin .num{position:absolute;top:12px;right:14px;font-weight:800;color:var(--soft);font-size:14px}
.pin h4{margin:0;font-size:18px;font-weight:800;font-stretch:95%;padding-right:34px}
.state{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;background:var(--open)}.pin.gnd .dot{background:var(--gnd)}
.meta{font-size:13px;color:var(--soft)}
.acts{display:flex;gap:8px;margin-top:auto}.acts .btn{flex:1}
/* chips de vista */
.seg{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:14px}
.seg button{flex:1 1 150px;min-height:46px;background:none;border:2px solid transparent;border-radius:var(--r-s);color:var(--soft);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--cobalt);color:#fff;border-color:var(--orange)}
.frz-ban{background:#fff4de;color:#7a4b00;border:2px solid #d98a00;border-radius:var(--r-s);padding:10px 14px;font-weight:700;margin-bottom:12px}
.mp-mod summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;cursor:pointer;min-height:44px;font-size:16px}
.mp-sa{background:var(--cobalt);color:#fff;border-radius:var(--r-s);padding:3px 10px;font-weight:800}
.mp-frz{border:2px solid var(--orange)}
.sw-st{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.sw-st i{width:12px;height:12px;border-radius:50%;background:var(--open)}
.sw-st.on{color:var(--gnd)}.sw-st.on i{background:var(--gnd)}.sw-st.err i{background:var(--red)}.sw-st.na{color:var(--soft);font-weight:500}
.assign{display:flex;gap:6px}.assign select{min-height:40px;padding:4px 8px}
/* Configuración */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field label{font-weight:700}
.rulef{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin:12px 0}
.rulef input,.rulef select{width:100%}
.tx-ban{padding:12px 14px;border-radius:var(--r-s);font-weight:800;margin:0 0 12px}
.tx-ban.live{background:#e3f6ea;color:#0f6b36;border:2px solid #1f9d55}.tx-ban.prev{background:#fff4de;color:#7a4b00;border:2px solid #d98a00}
.tx-st{font-size:12px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--line)}
.tx-st.LIVE{background:#1f9d55;color:#fff}.tx-st.PREVIEW{background:#d98a00;color:#fff}.tx-st.OFF{background:#56607a;color:#fff}.tx-st.FAIL{background:var(--red);color:#fff}
.stale td{opacity:.55}
.row-v{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;margin-top:6px;border-radius:var(--r-s);background:var(--paper);border-left:5px solid #b7bfd0}
.row-v span{color:var(--soft);font-size:14px}.row-v.ok{border-left-color:#1f9d55}.row-v.warn{border-left-color:#d98a00}.row-v.bad{border-left-color:var(--red)}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--orange);transition:width .4s}
.res{border-radius:var(--r-s);padding:12px 14px;font-weight:700;border-left:6px solid var(--red);background:var(--paper);margin-top:10px}.res.ok{border-left-color:var(--gnd)}
pre.fwlog{max-height:260px;overflow:auto;font-size:12px;background:var(--paper);padding:8px;border-radius:var(--r-s);white-space:pre-wrap}
details>summary{font-weight:700;cursor:pointer;min-height:40px;display:flex;align-items:center}
/* Consola */
#log{background:#0b1430;color:#cfe0ff;border-radius:var(--r-l);padding:14px;height:52vh;overflow:auto;font:13px/1.45 "Cascadia Mono",Consolas,monospace;white-space:pre-wrap;margin-bottom:12px}
#log .tx{color:#ffb27a}
.cmdline{display:flex;gap:10px}.cmdline input{flex:1;min-width:0}
/* Motor */
.vinbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 14px;margin-bottom:14px}
.gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.gauge{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--line);border-radius:var(--r-l);padding:12px 14px}
.gauge.ok{border-top-color:var(--gnd)}.gauge.warn{border-top-color:#d98a00}.gauge.bad{border-top-color:var(--red)}.gauge.bad .v{color:var(--red)}
.gauge .v{font-size:28px;font-weight:800;font-stretch:90%;line-height:1.1}.gauge .v small{font-size:12px;color:var(--soft)}
.gauge .l{color:var(--ink);font-size:14px;font-weight:700;margin-top:4px}.gauge .s{color:var(--soft);font-size:12px}
.lvchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.lvchip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:700;min-height:44px}
.lvchip span{margin-left:8px;background:var(--paper);border-radius:999px;padding:1px 8px;font-size:13px;color:var(--soft)}
.lvchip.on{background:var(--cobalt);border-color:var(--cobalt);color:#fff}.lvchip.on span{background:rgba(255,255,255,.2);color:#fff}
tr.modrow td{background:var(--paper);border-top:2px solid var(--line)}
/* Relojes */
.cluster{background:radial-gradient(900px 400px at 50% -10%,#1d2d57,#0b1226 70%);border-radius:18px;padding:10px 10px 12px;margin-bottom:18px;box-shadow:inset 0 0 0 1px #22305a}
.cl-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:4px 8px}
.cl-row.big{grid-template-columns:repeat(2,minmax(0,210px));justify-content:center;gap:4px 24px;margin-bottom:2px}
.dial{text-align:center;color:#dfe7fb;border-radius:14px;padding:4px 2px 8px}
.dial-svg{width:100%;max-width:160px;display:block;margin:0 auto}
.dial.big .dial-svg{max-width:200px}
.dial-face{fill:#0f1a36;stroke:#2a3a66;stroke-width:2}
.dial-track{fill:none;stroke:#223257;stroke-width:12}
.dial-zone{fill:none;stroke-width:10;opacity:.9}
.tick-M{stroke:#e8eefc;stroke-width:2.2}.tick-m{stroke:#7d8bb0;stroke-width:1}
.tick-l{fill:#c9d3ea;font:600 11px "Archivo",system-ui,sans-serif;text-anchor:middle}
.dial-unit{fill:#8f9cc0;font:600 10px "Archivo",system-ui,sans-serif;text-anchor:middle;letter-spacing:.5px}
.dial-val{fill:#fff;font:800 22px "Archivo",system-ui,sans-serif;text-anchor:middle}
.dial.big .dial-val{font-size:24px}
.needle{transform-box:view-box;transform-origin:100px 100px;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.needle-p{fill:#ff6a13}.hub{fill:#1a2748;stroke:#ff6a13;stroke-width:3}
.dial-name{font-weight:700;font-size:13px;margin-top:0}
.dial[data-z="warn"] .dial-val{fill:#fbbf24}.dial[data-z="bad"] .dial-val{fill:#f87171}.dial[data-z="bad"]{box-shadow:inset 0 0 0 2px #ef4444}
.dial[data-z="off"] .needle-p{fill:#56607a}.dial[data-z="off"] .dial-val{fill:#56607a}
.dial.j1708 .dial-name::after{content:" · J1708";color:#8f9cc0;font-weight:600;font-size:12px}
@media (prefers-reduced-motion: reduce){.needle{transition:none}}
.cl-bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 4px}
.cbar{background:#0f1a36;border:1px solid #22305a;border-radius:12px;padding:14px 16px;color:#dfe7fb}
.cbar-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;margin-bottom:8px}.cbar-h b{font-size:20px;white-space:nowrap}
.cbar-t{height:14px;border-radius:7px;background:#223257;overflow:hidden}.cbar-t i{display:block;height:100%;width:0;background:#22c55e;transition:width .6s}
.cbar[data-z="bad"] .cbar-t i{background:#ef4444}.cbar[data-z="bad"] b{color:#f87171}.cbar[data-z="off"] b{color:#56607a}
.cl-odo{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 4px}
.cl-odo div{background:#050a18;border:1px solid #22305a;border-radius:12px;padding:12px 16px;color:#8f9cc0;font-size:14px}
.cl-odo b{display:block;color:#7df9a4;font:700 24px "Cascadia Mono",Consolas,monospace;letter-spacing:1px}
.cl-note{color:#c9d3ea;text-align:center;margin:10px 0 0;font-size:14px;min-height:1em}
.cl-h{color:#c9d3ea;font-size:15px;margin:10px 6px 8px;font-weight:700}
.cl-sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px;margin:0 4px}
.swl{display:flex;align-items:center;gap:10px;background:#0f1a36;border:2px solid #22305a;border-radius:12px;padding:10px 12px;color:#8f9cc0;min-height:52px}
.swl i{flex:none;width:18px;height:18px;border-radius:50%;background:#2b3754;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)}
.swl div{flex:1;min-width:0}.swl span{display:block;font-weight:700;font-size:14px;line-height:1.2}
.swl small{display:block;font-size:11px;font-weight:800;letter-spacing:.5px;margin-top:2px}
.swl[data-st="on"]{border-color:#22c55e;color:#fff;background:#0f2a1f}
.swl[data-st="on"] i{background:#22c55e;box-shadow:0 0 12px #22c55e}
.swl[data-st="on"] small{color:#4ade80}
.swl[data-st="err"]{border-color:#ef4444}.swl[data-st="err"] i{background:#ef4444}.swl[data-st="err"] small{color:#f87171}
.swl.chg{animation:swchg .8s ease-out}
@keyframes swchg{0%{box-shadow:0 0 0 6px rgba(255,106,19,.6)}100%{box-shadow:0 0 0 0 rgba(255,106,19,0)}}
@media (prefers-reduced-motion: reduce){.swl.chg{animation:none}}
.cbar b small{font-size:12px;color:#8f9cc0;font-weight:600}.cbar b em{font-style:normal}
.cbar-s{display:flex;justify-content:space-between;font-size:11px;color:#6f7b95;margin-top:4px}
.cbar.gb .cbar-t i{transition:width .6s,background .3s}
.cbar[data-z="warn"] b em{color:#fbbf24}.cbar[data-z="bad"] b em{color:#f87171}.cbar[data-z="bad"]{border-color:#ef4444}
.cbar.j1708 .cbar-h span::after{content:" · J1708";color:#8f9cc0;font-size:12px}
/* Fallas */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.dlamp{padding:14px 16px;border-radius:var(--r-l);background:#1a2238;color:#5f6b85;border:2px solid #2b3754}
.dlamp b{display:block;font-size:19px;font-weight:800;letter-spacing:1px}.dlamp span{display:block;font-size:14px;color:#9aa7c2;margin-top:2px}
.dlamp.amber.on{color:#ffb000;border-color:#ffb000;box-shadow:0 0 20px rgba(255,176,0,.4)}
.dlamp.red.on{color:#ff3b30;border-color:#ff3b30;box-shadow:0 0 22px rgba(255,59,48,.5)}.dlamp.on span{color:#fff}
.sev{display:inline-block;border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.sev.sd{background:#ff3b30;color:#fff}.sev.ce{background:#ffb000;color:#1a1a1a}.sev.act{background:var(--gnd-bg);color:var(--red);border:1px solid var(--red)}.sev.prev{background:var(--paper);color:var(--soft)}
tr.frow{cursor:pointer}tr.frow:hover td{background:var(--gnd-bg)}
.lamp{color:#b86e00;font-weight:700}.okt{color:var(--gnd);font-weight:700}
dialog.big{max-width:820px;width:calc(100% - 24px);max-height:calc(100vh - 24px)}
dialog.big .dlg-b{overflow:auto;max-height:calc(100vh - 230px)}
.fd-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.fd-head h3{font-size:22px;margin:4px 0 0}
.fd-mod{font-size:14px;opacity:.9;font-weight:600}
.xbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px;flex:none}
.fd-codes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.fd-codes div{background:var(--paper);border-radius:var(--r-s);padding:10px 12px}.fd-codes span{display:block;color:var(--soft);font-size:13px}.fd-codes b{font-size:24px;font-weight:800}
.fd-sec{margin-bottom:14px}.fd-sec h4{margin:0 0 4px;font-size:15px;color:var(--cobalt)}.fd-sec p,.fd-sec ul{margin:0}.fd-sec ul{padding-left:20px}.fd-sec li{margin-bottom:4px}
.fd-diag{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s);padding:8px;overflow-x:auto}
/* Diálogos */
dialog{border:0;border-radius:var(--r-l);padding:0;max-width:520px;width:calc(100% - 32px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(8,16,40,.55)}
.dlg-h{background:var(--cobalt);color:#fff;padding:16px 20px}.dlg-h h3{margin:0;font-size:20px}
.dlg-b{padding:18px 20px}
.steps{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;color:var(--soft)}
.steps li b{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px}
.steps li.now{color:var(--ink);font-weight:700}.steps li.now b{border-color:var(--orange);background:var(--orange);color:#fff}
.steps li.done b{border-color:var(--gnd);background:var(--gnd);color:#fff}
.result{padding:12px;border-radius:var(--r-s);background:var(--paper);font-size:15px;min-height:24px;white-space:pre-wrap}
.dlg-f{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:var(--r-s);font-weight:600;display:none;max-width:90vw;z-index:70}
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  body{background:#fff!important;color:#000!important}
  #printArea{display:block!important;font:11px/1.35 Arial,sans-serif;color:#000}

function vinCheck(v){

  const w = [8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
  let sum = 0;
  for(let i=0;i<17;i++){ const c=v[i]; const n = /\d/.test(c) ? +c : map[c]; if(n===undefined) return false; sum += n*w[i]; }

}

function conv(val, unit){
  if(units!=="us") return [val, unit];
  switch(unit){
    case "°C": return [val*9/5+32, "°F"];
    case "kPa": return [val*0.145038, "psi"];
    case "km/h": return [val*0.621371, "mph"];
    case "km": return [val*0.621371, "mi"];
    case "L": return [val*0.264172, "gal"];
    case "L/h": return [val*0.264172, "gal/h"];
    case "km/L": return [val*2.35215, "mpg"];
  }
  return [val, unit];
}
function fmt(val, unit){
  const [v,u] = conv(val, unit);
  const d = Math.abs(v)>=1000 ? 0 : Math.abs(v)>=100 ? 1 : 2;

}
// --- decodificar un SPN ---
function decodeSpn(bytes, s){
  const [spn,, , by, bit, len, scale, off, unit, kind] = s;
  if(kind==="a"){ let t=""; for(let i=0;i<len/8;i++){ const c=bytes[by-1+i]; if(c>=32&&c<127) t+=String.fromCharCode(c); } return t.trim() ? t : null; }
  let raw;
  if(len<8){ raw = (bytes[by-1] >> (bit-1)) & ((1<<len)-1); if(raw === (1<<len)-1) return null; }
  else if(len===8){ raw = bytes[by-1]; if(raw > 0xFA) return null; }            // FB-FF = error / no disponible
  else { raw = 0; for(let i=len/8-1;i>=0;i--) raw = raw*256 + bytes[by-1+i];
         if(raw > (len===16 ? 0xFAFF : 0xFAFFFFFF)) return null; }
  if(kind==="s") return [L("Off","Apagado"),L("On","Encendido"),"Error",null][raw];
  if(len<8 && !unit && !scale) return String(raw);
  return fmt(raw*scale + off, unit);
}

               [L("Amber warning lamp","Lámpara ámbar"), lamp(bytes[0]>>2)],[L("Protect lamp","Lámpara protect"), lamp(bytes[0])]];
  const spn = bytes[2] | (bytes[3]<<8) | ((bytes[4]&0xE0)<<11), fmi = bytes[4]&0x1F, oc = bytes[5]&0x7F;
  if(spn && spn!==0x7FFFF) out.push([L("Active fault","Falla activa"), `SPN ${spn} FMI ${fmi} (x${oc})`]);

}

function faultDiagram(type, fmi){

    inj:  [[L("High side","Lado alto"), L("from ECM","del ECM"), R], [L("Low side","Lado bajo"), L("coil Ω: see spec","Ω de bobina: ver spec"), B]],
    sw:   [[L("Signal","Señal"), L("changes with switch","cambia con el switch"), B], [L("Ground / 12 V","Tierra / 12 V"), "", "#56607a"]],
    smart:[["+12 / 24 V", L("battery or key","batería o llave"), R], [L("Ground","Tierra"), "< 0.1 V", "#56607a"], ["CAN H", "≈ 2.5 – 3.5 V", B], ["CAN L", "≈ 1.5 – 2.5 V", "#7aa0ff"]],
    ref:  [["5 V ref", "≈ 5.0 V", O], [L("Return","Retorno"), "< 0.1 V", "#56607a"]],

    can:  [["CAN H", "≈ 2.5 – 3.5 V", B], ["CAN L", "≈ 1.5 – 2.5 V", "#7aa0ff"]],

  if(!wires) return "";

    inj: L("Injector","Inyector"), sw: "Switch", smart: L("Smart part","Componente"), ref: L("Sensors","Sensores"), pwr: L("Battery","Batería"), can: L("Other modules","Otros módulos")}[type];

  const x1 = 118, x2 = 432, mid = 275;

  svg += `<rect x="8" y="30" width="110" height="${H-60}" rx="10" fill="#2f63d8" opacity=".12" stroke="#2f63d8"/><text x="63" y="24" text-anchor="middle" font-size="14" font-weight="800" fill="${E}">ECM</text>`;

  svg += `<rect x="${mid-9}" y="38" width="18" height="${H-76}" rx="4" fill="none" stroke="${S}" stroke-dasharray="4 3"/><text x="${mid}" y="${H-12}" text-anchor="middle" font-size="11" fill="${S}">${L("connector","conector")}</text>`;
  wires.forEach(([name, val, c], i) => {

    svg += `<circle cx="${x1}" cy="${y}" r="5" fill="${c}"/><circle cx="${x2}" cy="${y}" r="5" fill="${c}"/>`;

}

function saveCsv(name, header, rows){
  const cell = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g,'""')}"` : v; };
  const blob = new Blob(["\ufeff" + [header, ...rows].map(r => r.map(cell).join(",")).join("\r\n")], {type:"text/csv"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();

async function linkConnect(silent){
  let r;
  try { r = await (await fetch(LINK + "/usb/open", {cache:"no-store"})).json(); } catch(e){ return false; }
  if(!r.ok){ if(!silent) toast(r.port ? L(`Could not open ${r.port}: ${r.error}. Close DATA-LIZ and Arduino, then try again.`,`No se pudo abrir ${r.port}: ${r.error}. Cierra DATA-LIZ y Arduino y vuelve a intentar.`) : L("DATA-LIZ module not found.","No se encontró el módulo DATA-LIZ.")); return false; }
  linkUsb = true; linkPort = r.port;
  clearInterval(linkTimer);
  linkTimer = setInterval(async () => {
    if(!linkUsb) return;
    try {
      const res = await fetch(LINK + "/usb/read", {cache:"no-store"});
      if(res.status === 410){ toast(L("Module disconnected.","Módulo desconectado.")); linkDisconnect(); return; }
      buf += await res.text(); pump();
    } catch(e){ toast(L("Lost the connection to the module.","Se perdió la conexión con el módulo.")); linkDisconnect(); }
  }, 150);
  setConnected(true, "DATA-LIZ · " + r.port);
  return true;
}
function linkDisconnect(){
  if(!linkUsb) return;
  linkUsb = false; linkPort = ""; clearInterval(linkTimer); linkTimer = null;
  fetch(LINK + "/usb/close", {cache:"no-store"}).catch(() => {});
  beforeDisconnect(); buf = ""; setConnected(false);
}
function pump(){ let i; while((i = buf.indexOf("\n")) >= 0){ const line = buf.slice(0, i).replace(/\r$/, ""); buf = buf.slice(i + 1); handleLine(line); } }
async function usbConnect(p, silent){
  if(!("serial" in navigator)){ if(!silent) toast(L("This browser cannot use the USB port. Use Microsoft Edge or Chrome.","Este navegador no puede usar el puerto USB. Usa Microsoft Edge o Chrome.")); return false; }
  try {
    port = p || await navigator.serial.requestPort({filters:[{usbVendorId:0x10C4, usbProductId:0xEA60},{usbVendorId:0x1A86, usbProductId:0x7523}]});
    await port.open({baudRate:115200});
    try { await port.setSignals({dataTerminalReady:false, requestToSend:false}); } catch(e){}
    writer = port.writable.getWriter();
    setConnected(true, L("DATA-LIZ module (USB)","Módulo DATA-LIZ (USB)"));
    readLoop(); return true;
  } catch(e){ port = null; if(!silent && e.name !== "NotFoundError") toast(L("Could not open the port: ","No se pudo abrir el puerto: ") + e.message + L(" Close DATA-LIZ first."," Cierra DATA-LIZ primero.")); return false; }
}
async function readLoop(){
  const dec = new TextDecoder();
  while(port && port.readable && connected && !linkUsb){
    reader = port.readable.getReader();
    try { while(true){ const {value, done} = await reader.read(); if(done) break; buf += dec.decode(value, {stream:true}); pump(); } }
    catch(e){ if(connected) toast(L("Lost the connection to the module.","Se perdió la conexión con el módulo.")); }
    finally { try { reader.releaseLock(); } catch(e){} }
    await disconnect(); break;
  }
}
async function disconnect(){
  if(linkUsb){ linkDisconnect(); return; }
  if(BLE.dev){ const d = BLE.dev; BLE.dev = null; BLE.rx = null; try { d.gatt.disconnect(); } catch(e){} beforeDisconnect(); buf = ""; setConnected(false); return; }
  beforeDisconnect();
  const p = port; port = null;
  try { if(reader) await reader.cancel(); } catch(e){}
  try { if(writer) writer.releaseLock(); } catch(e){}
  try { if(p) await p.close(); } catch(e){}
  writer = null; reader = null; buf = ""; setConnected(false);
}
function beforeDisconnect(){
  if(detect.on && connected){ send("WATCH OFF"); }
  detect.on = false; SNF.j1939 = SNF.j1708 = false;
}

function handleLine(line){
  let m;
  // Lo que escribe (TXLIST): no se muestra en la consola
  if((m = line.match(/^TXMODE (\w+) SA (\d+)/))){ TX.tmp = []; TX.mode = m[1]; TX.sa = +m[2]; return; }
  if(TX.tmp && (m = line.match(/^TX (\d+) (\w+) (\d+) (\d+) (\d+) (\d+)((?: [0-9A-F]{2})*)$/))){
    TX.tmp.push({pgn:+m[1], st:m[2], n:+m[3], age:+m[4], per:+m[5], len:+m[6], b:m[7].trim().split(" ").filter(Boolean).map(h => parseInt(h,16))}); return; }
  if(line === "TXEND" && TX.tmp){ TX.rows = TX.tmp.sort((a,b) => a.pgn - b.pgn); TX.tmp = null; TX.t = Date.now(); renderBridge(); return; }

  logLine(line);
  if(engLine(line)){ if(tab === "flt") renderFlt(); return; }
  if(/^J1708 OK|^\[J1587DM\] |^\s{2}(RPM|Refrigerante|Bateria|Velocidad)\s/.test(line)) BUS.j1708 = Date.now();
  if(/^\[RAW\] \d|^\[DM\] |^\[ID\] PGN|^\[SW\] |^SNIFF|^\[SNIFF\]/.test(line)) BUS.j1939 = Date.now();

  if((m = line.match(/Perfil (\d+) \| CAN (\d+) kbps \((AUTO|fija)\) \| modo (normal|solo escucha) \| red (con trafico|SIN trafico)/))){
    const baud = +m[2], traffic = m[5] === "con trafico";
    setNet(baud, traffic);
    lastNet = `${baud} kbps · ` + (traffic ? L("traffic","con tráfico") : L("no traffic","sin tráfico"));
    $("#netText").textContent = (BLE.dev ? "Bluetooth · " : linkPort ? linkPort + " · " : "") + lastNet;
    const sb = $("#selBaud"); if(sb) sb.value = m[3] === "AUTO" ? "AUTO" : String(baud);
    return;
  }
  if((m = line.match(/^\s*(\d+)\s+(\S+)\s+GPIO\d+\s+(ACTIVA|reposo)\s+(a GND|abierta)\s+\((interrumpe GND|envia GND)\)/))){
    const i = +m[1]; if(i < OUTS.length){ outState[i] = {act:m[3] === "ACTIVA", gnd:m[4] === "a GND", inv:m[5] === "interrumpe GND"}; renderRack(); }
    return;
  }
  // SCAN: se junta la lista completa antes de mostrarla (no parpadea)
  if(/PGN y Source Address vistos/.test(line)){ SC.tmp = []; clearTimeout(SC.timer); SC.timer = setTimeout(scanCommit, 600); return; }
  if((m = line.match(/PGN\s+(\d+)\s+SA\s+(\d+)\s+(\d+) tramas\s+((?:[0-9A-F]{2} ){8})\s*(.*)$/))){
    if(!SC.tmp) SC.tmp = [];
    SC.tmp.push({pgn:+m[1], sa:+m[2], n:+m[3], data:m[4].trim()});
    clearTimeout(SC.timer); SC.timer = setTimeout(scanCommit, 250);
    return;
  }
  // LIST (reglas)
  if(/^\s*n\s+PGN\s+SA\s+byte/.test(line)){ ruleRows = []; collectingRules = true; renderRules(); return; }
  if(collectingRules && (m = line.match(/^\s*(\d+)\s+(\d+)\s+(\*|\d+)\s+(\d)\s+(\d)\s+(\d)\s+(\d+)\s+(\d+)/))){
    ruleRows.push({n:+m[1], pgn:+m[2], sa:m[3], byte:+m[4], bit:+m[5], w:+m[6], v:+m[7], out:+m[8]}); renderRules(); return;
  }
  // BSTATUS (puente J1708)
  if((m = line.match(/^Puente: (ON|OFF) \| SA (\d+) \(([^)]+)\) \| MID (\d+) \| velocidad (ON|OFF) \| fallos TX (\d+)/))){
    BR.on = m[1] === "ON"; BR.line = `SA ${m[2]} (${m[3]}) · MID ${m[4]} · ` + L("unacknowledged frames ","tramas sin confirmar ") + m[6];
    const sb = $("#selBridge"); if(sb) sb.value = m[1]; renderBridgeHead(); return;
  }
  // Cazar switch (WATCH)
  if(/^\[WATCH\] midiendo/.test(line)){ setDetInfo(L("Measuring… don't touch any switch (3 s).","Midiendo… no toques ningún switch (3 s).")); return; }
  if(/^\[WATCH\] listo/.test(line)){ setDetInfo(L("Ready: operate the switches one by one.","Listo: activa los switches uno por uno.")); return; }
  if((m = line.match(/^\[SW\] PGN (\d+) SA (\d+) byte (\d) bit (\d) ancho (\d) (\d+)->(\d+)/))){
    detectAdd({pgn:+m[1], sa:+m[2], byte:+m[3], bit:+m[4], width:+m[5], from:+m[6], to:+m[7]}); return;
  }
  // Enviar mensaje de prueba
  if((m = line.match(/^\[SEND\] (.*)$/))){
    const i = $("#sendInfo"); if(i) i.textContent = /^enviado/.test(m[1]) ? L("Sent.","Enviado.") : /solo escucha/.test(m[1]) ? L("Not sent: the module is listen-only. Turn the bridge on and wait for the network.","No se envió: el módulo está en solo escucha. Enciende el puente y espera la red.") : L("Not sent: ","No se envió: ") + m[1];
    return;
  }
  // Exportar configuración
  if(line.startsWith("DEFAULTS;")){ if(exporting){ exporting = false; clearTimeout(exportTimer); downloadConfig(line); } return; }
  // Aprender
  if(learning){
    if(/LEARN: ahora ACTIVA/.test(line)){ setStep(2); $("#lnOk").disabled = false; $("#learnResult").textContent = L("Turn the switch on and hold it.","Activa el switch y mantenlo."); return; }
    if((m = line.match(/cambio: (.+)$/))){ learning.changes.push(m[1]); $("#learnResult").textContent = L("Changes seen:\n","Cambios vistos:\n") + learning.changes.join("\n"); return; }
    if((m = line.match(/LEARN: regla (\d+) creada para (\S+): PGN (\d+) \(([^)]*)\) SA (\d+) byte (\d) bit (\d) ancho (\d) valor (\d+)/))){
      setStep(3, true);
      $("#learnResult").innerHTML = L(`<b>Done.</b> ${esc(NICE(m[2]))} uses PGN <b>${m[3]}</b> from address <b>${m[5]}</b>, byte ${m[6]}, bit ${m[7]}.<br>Release the switch and save.`,
                                      `<b>Listo.</b> ${esc(NICE(m[2]))} usa el PGN <b>${m[3]}</b> de la dirección <b>${m[5]}</b>, byte ${m[6]}, bit ${m[7]}.<br>Suelta el switch y guarda.`);
      $("#lnOk").hidden = true; $("#lnSave").hidden = false; $("#lnCancel").textContent = L("Close","Cerrar"); learning.done = true; return;
    }
    if(/no vi ningun cambio/.test(line)){ $("#learnResult").textContent = L("No change seen. Close and try again, turning the switch on after the prompt.","No vi ningún cambio. Cierra y vuelve a intentar, activando el switch después del aviso."); learning.done = true; $("#lnOk").disabled = true; $("#lnCancel").textContent = L("Close","Cerrar"); return; }
    if(/no hay reglas libres/.test(line)){ $("#learnResult").textContent = L("No free rules left. Delete one in Settings.","No quedan reglas libres. Borra una en Configuración."); learning.done = true; $("#lnCancel").textContent = L("Close","Cerrar"); return; }
  }
  if(/Guardado en perfil/.test(line)){
    if(importing){ clearTimeout(importing.timer); showDone(L("Upload complete","Carga terminada"), L(`"${importing.name}" was loaded into the module and saved.`,`"${importing.name}" se cargó en el módulo y quedó guardado.`)); importing = null; setTimeout(() => send("LIST"), 400); }
    else toast(L("Saved to the module.","Guardado en el módulo."));
  }
}
function scanCommit(){
  clearTimeout(SC.timer);
  if(!SC.tmp) return;
  const rows = SC.tmp; SC.tmp = null;
  const now = Date.now();
  for(const r of rows){
    const k = r.pgn + "-" + r.sa, prev = SCAN_PREV[k];
    if(prev !== undefined && prev !== r.data){
      CHG_AT[k] = now;
      if(tab === "red" && RED.view !== "hunt" && (SWITCH_PGNS.has(r.pgn) || r.pgn >= 65280)) toast(L(`Change: PGN ${r.pgn} SA ${r.sa}`,`Cambio: PGN ${r.pgn} SA ${r.sa}`));
    }
    SCAN_PREV[k] = r.data;
  }
  const tot = rows.reduce((a, r) => a + r.n, 0); if(BUS.frames && tot > BUS.frames) BUS.j1939 = now; BUS.frames = tot;
  scanRows = rows; SC.dirty = true;
}

    <div class="rulef"><input id="sPgn" type="number" inputmode="numeric" placeholder="PGN (ej. 65265)" value="${esc(RED.sPgn || "")}">

    <label style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="sRepeat"> ${L("Repeat every 100 ms for 5 seconds","Repetir cada 100 ms durante 5 segundos")}</label>
    <button class="btn primary small" id="btnSendMsg">${L("Send message","Enviar mensaje")}</button> <span id="sendInfo" class="lede"></span></details>`;

let sendTimer = null;
function bindSend(){
  const d = $("#sendBox"); if(!d) return;
  d.addEventListener("toggle", () => { RED.sendOpen = d.open; });
  $("#sPgn").oninput = e => RED.sPgn = e.target.value; $("#sData").oninput = e => RED.sData = e.target.value;
  $("#btnSendMsg").onclick = () => {
    const pgn = $("#sPgn").value.trim(), bytes = $("#sData").value.trim().split(/[\s,]+/).filter(Boolean);
    if(!/^\d+$/.test(pgn) || +pgn > 262143){ toast(L("Enter a valid PGN (decimal).","Escribe un PGN válido (decimal).")); return; }
    if(bytes.length !== 8 || !bytes.every(b => /^[0-9a-fA-F]{1,2}$/.test(b))){ toast(L("Enter exactly 8 bytes in hex.","Escribe exactamente 8 bytes en hex.")); return; }
    const rep = $("#sRepeat").checked;
    if(!confirm(L(`Send PGN ${pgn} [${bytes.join(" ").toUpperCase()}]${rep ? " every 100 ms for 5 s" : ""} on the truck network?\n\nOnly with the truck parked.`,`¿Enviar el PGN ${pgn} [${bytes.join(" ").toUpperCase()}]${rep ? " cada 100 ms durante 5 s" : ""} a la red del camión?\n\nHazlo solo con el camión estacionado.`))) return;
    const cmd = `SEND ${pgn} ${bytes.join(" ")}`; clearInterval(sendTimer);
    if(!rep){ send(cmd); return; }
    let n = 0; RED.sendBusy = true;
    sendTimer = setInterval(() => { if(++n > 50 || !connected){ clearInterval(sendTimer); RED.sendBusy = false; const i = $("#sendInfo"); if(i) i.textContent = L("Done (50 frames).","Listo (50 tramas)."); return; } send(cmd); }, 100);
  };
}
function exportCsv(){

  if(!rows.length){ toast(L("Nothing to export yet.","Todavía no hay nada para exportar.")); return; }
  const f = saveCsv(`DATA-LIZ-MODULE_red_${stamp()}.csv`, ["PGN","SA",L("Module","Módulo"),L("Name","Nombre"),L("Description","Descripción"),L("Frames","Tramas"),L("Data","Datos"),""], rows);

function setDetInfo(t){ detect.info = t; const i = $("#detectInfo"); if(i) i.textContent = t; }

const detKey = e => `${e.pgn}-${e.sa}-${e.byte}-${e.bit}-${e.width}`;

function detectAdd(e){

function renderStd(){
  const b = $("#swBody"); if(!b) return;
  if(b.contains(document.activeElement) && document.activeElement.tagName === "SELECT") return;
  const rows = [];
  for(const r of scanRows){
    const bytes = r.data.split(" ").map(h => parseInt(h, 16));
    for(const s of SWITCHES){
      if(s[0] !== r.pgn) continue;
      const v = (bytes[s[1]-1] >> (s[2]-1)) & 3;
      if(!RED.swAll && v === 3) continue;
      rows.push({key:`${s[0]}-${r.sa}-${s[1]}-${s[2]}`, s, v, sa:r.sa});
    }
  }
  rows.sort((a, c) => (a.v === 3) - (c.v === 3) || swName(a.s).localeCompare(swName(c.s)));
  if(!rows.length){ b.innerHTML = `<tr><td colspan="8">${scanRows.length ? L("No standard switches on this truck.","Este camión no manda switches estándar.") : L("No data yet.","Todavía no hay datos.")}</td></tr>`; return; }
  b.innerHTML = rows.map(r => {
    const cls = r.v === 1 ? "on" : r.v === 2 ? "err" : r.v === 3 ? "na" : "", ch = lastSw[r.key] !== undefined && lastSw[r.key] !== r.v;
    const opts = OUTS.map((o, i) => `<option value="${i}" ${i === r.s[6] ? "selected" : ""}>${i} · ${esc(NICE(o))}</option>`).join("");
    return `<tr class="${ch ? "flash" : ""}"><td><b>${esc(swName(r.s))}</b></td><td><span class="sw-st ${cls}"><i></i>${STATE(r.v)}</span></td>
      <td>${r.s[0]}</td><td>${r.sa}</td><td>${r.s[1]}</td><td>${r.s[2]}-${r.s[2]+1}</td><td>${r.s[3]}</td>
      <td><div class="assign"><select data-sel="${r.key}" aria-label="${L("Output","Salida")}">${opts}</select><button class="btn ghost small" data-assign="${r.s[0]},${r.sa},${r.s[1]},${r.s[2]}" data-key="${r.key}">${L("Use","Usar")}</button></div></td></tr>`;
  }).join("");
  rows.forEach(r => lastSw[r.key] = r.v);
}
function freeRule(){ const used = new Set(ruleRows.map(r => r.n)); for(let i = 0; i < 24; i++) if(!used.has(i)) return i; return -1; }
function assign(pgn, sa, by, bit, width, out){
  const n = freeRule();
  if(n < 0){ showDone(L("No free rules","Sin reglas libres"), L("The module already has 24 rules. Delete one in Settings.","El módulo ya tiene 24 reglas. Borra alguna en Configuración.")); return; }
  const bits = width === 2 ? `${bit}-${bit+1}` : `${bit}`;
  if(!confirm(L(`Use PGN ${pgn}, address ${sa}, byte ${by}, bits ${bits} for output ${out} (${NICE(OUTS[out])})?`,`¿Usar el PGN ${pgn}, dirección ${sa}, byte ${by}, bits ${bits} para la salida ${out} (${NICE(OUTS[out])})?`))) return;
  send(`RULE ${n} ${pgn} ${sa} ${by} ${bit} ${width} 1 ${out}`);
  ruleRows.push({n, pgn, sa:String(sa), byte:by, bit, w:width, v:1, out});
  setTimeout(() => { send("SAVE"); send("LIST"); }, 300);
  showDone(L("Switch assigned","Switch asignado"), L(`${NICE(OUTS[out])} now follows PGN ${pgn} from address ${sa} (byte ${by}, bits ${bits}). Saved to the module.`,`${NICE(OUTS[out])} ahora sigue el PGN ${pgn} de la dirección ${sa} (byte ${by}, bits ${bits}). Quedó guardado en el módulo.`));
}

  const f = saveCsv(`DATA-LIZ-MODULE_switches_${stamp()}.csv`, ["Switch","PGN","SA","Byte","Bits",L("Width","Ancho"),L("Last change","Último cambio"),L("Times","Veces"),L("Last seen","Visto")], rows);
  showDone(L("Export complete","Exportación terminada"), L(`${rows.length} switches saved to Downloads as "${f}".`,`${rows.length} switches se guardaron en Descargas como "${f}".`));
}

    importing = {name: f.name, timer: setTimeout(() => { if(importing){ importing = null; showDone(L("Upload failed","No se cargó"), L("The module did not confirm it saved the settings.","El módulo no confirmó que guardó la configuración.")); } }, 8000)};
    send(text);
  };
  renderRules(); renderBridge(); renderFw(); renderUpd();
}
function downloadConfig(line){
  const d = new Date().toISOString().slice(0,10), name = `DATA-LIZ_config_${d}.txt`;
  const blob = new Blob([`# DATA-LIZ settings ${d}\n${line}\n`], {type:"text/plain"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  showDone(L("Download complete","Descarga terminada"), L(`Module settings saved to Downloads as "${name}".`,`La configuración del módulo se guardó en Descargas como "${name}".`));
}

// ---- Puente J1708 → J1939 + vista previa de lo que escribe + PGN ON/OFF ----
function renderBridge(){
  const box = $("#bridgeBox"); if(!box || tab !== "cfg") return;
  const old = connected && TX.asked && !TX.t && Date.now() - TX.asked > 3500;
  const ban = !connected ? `<p class="lede" style="margin:0">${L("Connect the module first.","Primero conecta el módulo.")}</p>`
    : old ? `<div class="res">${L("The module firmware does not have this view. Write firmware v2.10 or newer (below).","El firmware del módulo no tiene esta vista. Graba el firmware v2.10 o más nuevo (abajo).")}</div>`
    : TX.mode === "LIVE" ? `<div class="tx-ban live">● ${L("WRITING: these messages are going out on the truck network now","ESCRIBIENDO: estos mensajes están saliendo ahora a la red del camión")} (SA ${TX.sa})</div>`
    : TX.mode === "PREVIEW" ? `<div class="tx-ban prev">◌ ${L("PREVIEW: the bridge is off, nothing is written. This is exactly what the module WOULD write.","VISTA PREVIA: el puente está apagado, no se escribe nada. Esto es exactamente lo que el módulo ESCRIBIRÍA.")}</div>`
    : TX.mode === "IDLE" ? `<p class="lede" style="margin:0">${L("Nothing to write: no J1708 data from the engine. Check the J1708 wires.","Nada que escribir: no llegan datos J1708 del motor. Revisa los cables de J1708.")}</p>`
    : `<p class="lede" style="margin:0">${L("Reading…","Leyendo…")}</p>`;
  const stTxt = {LIVE:L("sent","enviado"), PREVIEW:L("preview","vista previa"), OFF:L("turned off","apagado"), FAIL:L("failed","falló")};
  const vin = r => r.pgn === 65260 ? `VIN: ${esc(r.b.map(c => c >= 32 && c < 127 ? String.fromCharCode(c) : "").join("").split("*")[0])}` : "";
  box.innerHTML = `<h3 style="margin-top:6px">${L("J1708 → J1939 bridge","Puente J1708 → J1939")}</h3>
    <div class="card">
      <div id="brHead"></div>
      <p class="lede" style="margin:12px 0 8px">${L("What it writes: every PGN the module builds from the J1708 engine data. Compare with JPRO before turning the bridge on.","Lo que escribe: cada PGN que el módulo arma con los datos J1708 del motor. Compáralo con JPRO antes de prender el puente.")}</p>
      ${ban}
    </div>
    ${TX.rows.length ? `<div class="card tbl scroll"><table><thead><tr><th>PGN</th><th>${L("Name","Nombre")}</th><th>${L("Every","Cada")}</th><th>${L("Data","Datos")}</th><th>PGN ON/OFF</th></tr></thead><tbody>
      ${TX.rows.map(r => { const inf = pgnInfo(r.pgn), stale = r.age > Math.max(3000, r.per * 4);
        return `<tr class="${stale ? "stale" : ""}"><td><b>${r.pgn}</b><br><span class="tx-st ${r.st}">${stTxt[r.st] || esc(r.st)}</span></td>
          <td><b>${esc(inf.acr)}</b><br><small>${esc(inf.name)}</small>${vin(r) ? "<br><small>" + vin(r) + "</small>" : ""}</td>
          <td>${r.per ? (r.per >= 1000 ? (r.per / 1000).toFixed(1) + " s" : r.per + " ms") : "—"}${stale ? `<br><small>${L("not updating","sin actualizar")}</small>` : ""}</td>
          <td class="hex">${r.b.map((x, i) => x.toString(16).toUpperCase().padStart(2, "0") + (i % 8 === 7 && i < r.b.length - 1 ? "<br>" : " ")).join("")}${r.len > 8 ? `<br><small>(${r.len} bytes)</small>` : ""}</td>
          <td><button class="btn ${r.st === "OFF" ? "primary" : "ghost"} small" data-pgnt="${r.pgn}" data-on="${r.st === "OFF" ? 1 : 0}">${r.st === "OFF" ? L("Turn on","Prender") : L("Turn off","Apagar")}</button></td></tr>`; }).join("")}
      </tbody></table></div>` : ""}`;
  box.querySelectorAll("[data-pgnt]").forEach(b => b.onclick = () => { send(`PGN ${b.dataset.on === "1" ? "ON" : "OFF"} ${b.dataset.pgnt}`); setTimeout(() => send("SAVE"), 300); });
  renderBridgeHead();
}
function renderBridgeHead(){

// ---- Actualizar firmware (usa el enlace: /fw/info, /fw/start, /fw/status, /fw/cancel) ----
const FW = {info:null, file:null, src:"", busy:false, st:null, timer:null, stage:"", pct:0, result:null};
async function fwInfo(){ try { FW.info = await (await fetch(LINK + "/fw/info", {cache:"no-store"})).json(); } catch(e){ FW.info = {ok:false}; } renderFw(); }
function fwStage(log){
  let st = L("Compiling… (the first time it can take 5–10 minutes)","Compilando… (la primera vez puede tardar 5–10 minutos)"), pct = 0;
  if(/Sketch uses/i.test(log)) st = L("Compiled. Connecting to the module…","Compilado. Conectando con el módulo…");
  if(/Connecting/i.test(log)) st = L("Connecting… (if it stays here, hold the BOOT button)","Conectando… (si se queda aquí, mantén presionado el botón BOOT)");
  const w = [...log.matchAll(/Writing at 0x[0-9a-f]+\.*\s*\((\d+)\s*%\)/gi)];
  if(w.length){ pct = +w[w.length-1][1]; st = L(`Writing to the module… ${pct} %`,`Grabando en el módulo… ${pct} %`); }
  if(/Hard resetting|Leaving/i.test(log)) st = L("Written. Restarting the module…","Grabado. Reiniciando el módulo…");
  return [st, pct];
}
function fwWhy(log){
  if(/Failed to connect|Wrong boot mode|No serial data received|Timed out waiting/i.test(log)) return L("The module did not enter programming mode. Hold BOOT on the board, press Compile and write again, and let go when it says Writing.","El módulo no entró en modo de programación. Mantén presionado BOOT en la placa, toca Compilar y grabar otra vez y suelta cuando diga Grabando.");
  if(/could not open port|Access is denied|PermissionError|port is busy/i.test(log)) return L("The port is busy. Close DATA-LIZ, Arduino IDE and its Serial Monitor, then try again.","El puerto está ocupado. Cierra DATA-LIZ, Arduino IDE y su Monitor Serie e inténtalo otra vez.");
  if(/platform not installed|not found|Unknown FQBN/i.test(log)) return L("The ESP32 boards are not installed in Arduino IDE (Boards Manager: esp32 by Espressif).","Faltan las placas ESP32 en Arduino IDE (Gestor de placas: esp32 by Espressif).");
  const e = log.split("\n").find(l => /error:/i.test(l));
  return e ? L("The code has an error: ","El código tiene un error: ") + e.trim().slice(0, 220) : L("It did not finish. Look at the details.","No terminó. Mira el detalle.");
}
function fwSizes(log){
  const a = log.match(/Sketch uses (\d+) bytes \((\d+)%\)/i), g = log.match(/Global variables use (\d+) bytes \((\d+)%\)/i);
  const row = (t, m) => m ? `<div class="row-v ${+m[2] > 90 ? "bad" : +m[2] > 75 ? "warn" : "ok"}"><span>${t}</span><b>${(+m[1]).toLocaleString()} bytes · ${m[2]} %</b></div>` : "";
  return row(L("Program (flash)","Programa (flash)"), a) + row(L("Variables (RAM)","Variables (RAM)"), g);
}
async function fwStart(){
  if(!FW.src || FW.busy) return;
  if(!confirm(L(`Write ${FW.file} to the module?\n\nThe module stops for 1–10 minutes. Truck parked. Learned switches are kept.`,`¿Grabar ${FW.file} en el módulo?\n\nEl módulo deja de funcionar 1–10 minutos. Camión estacionado. Los switches aprendidos se conservan.`))) return;
  FW.busy = true; FW.result = null; FW.st = null; FW.stage = L("Starting…","Empezando…"); FW.pct = 0;
  userStopped = true; if(connected) await disconnect();
  renderFw();
  let r = null;
  try { r = await (await fetch(LINK + "/fw/start?name=" + encodeURIComponent(FW.file) + "&fqbn=esp32:esp32:esp32", {method:"POST", body:FW.src})).json(); } catch(e){}
  if(!r || !r.ok){
    FW.busy = false; userStopped = false;
    FW.result = {ok:false, why: !r ? L("The DATA-LIZ link is not running. Open DATA-LIZ MODULE from its Desktop icon.","El enlace de DATA-LIZ no está corriendo. Abre DATA-LIZ MODULE desde su ícono del Escritorio.")
      : r.error === "nocli" ? L("Arduino IDE is not installed on this tablet (it is needed, not opened).","Arduino IDE no está instalado en esta tablet (hace falta instalado, no abierto).")
      : r.error === "noport" ? L("The module is not plugged in over USB.","El módulo no está conectado por USB.")
      : r.error === "notino" ? L("That file is not an Arduino sketch (.ino).","Ese archivo no es un programa de Arduino (.ino).")
      : r.error === "busy" ? L("An update is already running.","Ya hay una actualización corriendo.") : String(r.error)};
    renderFw(); return;
  }
  clearInterval(FW.timer); FW.timer = setInterval(fwPoll, 1000);
}
async function fwPoll(){
  let s = null; try { s = await (await fetch(LINK + "/fw/status", {cache:"no-store"})).json(); } catch(e){ return; }
  FW.st = s; [FW.stage, FW.pct] = fwStage(s.log || "");
  if(!s.running){
    clearInterval(FW.timer); FW.timer = null; FW.busy = false; userStopped = false;
    FW.result = s.exit === 0 ? {ok:true} : {ok:false, why:fwWhy(s.log || "")};
    if(s.exit === 0){ toast(L("Firmware written. Reconnecting…","Firmware grabado. Reconectando…")); setTimeout(autoDetect, 2500); }
  }
  renderFw();
}

  box.innerHTML = `<h3 style="margin-top:6px">${L("Update the module firmware","Actualizar el firmware del módulo")}</h3>
    <div class="card">
      <p class="lede" style="margin:0 0 8px">${L("Pick the .ino file (for example j1939_gateway_v2_10.ino). It is compiled and written over USB. Arduino IDE must be installed, but you don't open it.","Escoge el archivo .ino (por ejemplo j1939_gateway_v2_10.ino). Se compila y se graba por USB. Arduino IDE tiene que estar instalado, pero no lo abres.")}</p>
      ${i ? (i.ok ? line(!!i.cli, L("Arduino tools","Herramientas de Arduino"), i.cli ? L("found","encontradas") : L("not found","no encontradas"))
                  + line(i.cli ? !!i.core : null, L("ESP32 boards","Placas ESP32"), i.core ? L("installed ","instaladas ") + esc(i.coreVersion || "") : L("not installed","no instaladas"))
                  + line(i.port ? true : null, L("Module port","Puerto del módulo"), esc(i.port) || L("not plugged in","no conectado"))
                : line(false, L("DATA-LIZ link","Enlace de DATA-LIZ"), L("not running or old","no está corriendo o es viejo")))
          : `<p class="lede" style="margin:0">${L("Checking…","Revisando…")}</p>`}
      <div class="toolbar" style="margin:12px 0 0">
        <label class="btn ghost" style="cursor:pointer;display:inline-flex;align-items:center">${FW.file ? esc(FW.file) : L("Choose .ino file","Escoger archivo .ino")}<input type="file" id="fwFile" accept=".ino,.txt" hidden ${FW.busy ? "disabled" : ""}></label>
        <button class="btn primary" id="fwGo" ${FW.src && !FW.busy && i && i.ok && i.cli && i.port ? "" : "disabled"}>${L("Compile and write","Compilar y grabar")}</button>
        ${FW.busy ? `<button class="btn danger" id="fwStop">${L("Stop","Detener")}</button>` : ""}
        <button class="btn ghost" id="fwRe" ${FW.busy ? "disabled" : ""}>${L("Check again","Revisar otra vez")}</button>
      </div>
      ${s && s.log ? `<div style="margin-top:10px">${fwSizes(s.log)}</div>` : ""}
      ${FW.busy ? `<p style="margin:10px 0 6px"><b>${FW.stage}</b> ${s ? `<small class="lede">(${s.seconds} s)</small>` : ""}</p><div class="bar"><i style="width:${FW.pct}%"></i></div>` : ""}
      ${FW.result ? (FW.result.ok ? `<div class="res ok">${L("Done: the new firmware is in the module.","Listo: el firmware nuevo ya está en el módulo.")}</div>` : `<div class="res">${esc(FW.result.why)}</div>`) : ""}
      ${s && s.log ? `<details style="margin-top:8px"><summary>${L("Details","Detalle")}</summary><pre class="fwlog">${esc(s.log.split("\n").slice(-60).join("\n"))}</pre></details>` : ""}
    </div>
    <p class="lede" style="font-size:13px">${esc(MOD_BUILD)}</p>`;
  const f = $("#fwFile"); if(f) f.onchange = async () => { const x = f.files[0]; if(!x) return; FW.file = x.name.replace(/\.txt$/i, ".ino"); FW.src = await x.text(); FW.result = null; renderFw(); };
  const g = $("#fwGo"); if(g) g.onclick = fwStart;
  const st = $("#fwStop"); if(st) st.onclick = async () => { if(confirm(L("Stop the update? If it stops while writing, write it again before using the module.","¿Detener la actualización? Si se detiene mientras graba, vuelve a grabarla antes de usar el módulo."))) fetch(LINK + "/fw/cancel").catch(() => {}); };
  const re = $("#fwRe"); if(re) re.onclick = fwInfo;
}

// ---- Actualizar DATA-LIZ MODULE (archivo nuevo en Descargas; lo instala el enlace) ----
const UPD = {info:null, busy:false};
async function updCheck(){ try { UPD.info = await (await fetch(LINK + "/update/check", {cache:"no-store"})).json(); } catch(e){ UPD.info = {ok:false}; } renderUpd(); }
async function updApply(){
  UPD.busy = true; renderUpd(); let r = null;
  try { r = await (await fetch(LINK + "/update/apply", {cache:"no-store"})).json(); } catch(e){}
  UPD.busy = false;
  if(!r || !r.ok){ showDone(L("Update failed","No se pudo actualizar"), L("Close DATA-LIZ MODULE, open it again and try once more.","Cierra DATA-LIZ MODULE, ábrelo otra vez e inténtalo de nuevo.")); renderUpd(); return; }
  if(r.module){ toast(L("New version installed. Reloading…","Versión nueva instalada. Recargando…")); setTimeout(() => location.reload(), 1200); return; }
  if(r.launcher) showDone(L("Update installed","Actualización instalada"), L("Close DATA-LIZ and DATA-LIZ MODULE and open them again to finish.","Cierra DATA-LIZ y DATA-LIZ MODULE y ábrelos otra vez para terminar."));
  else toast(L("Nothing new to install.","No hay nada nuevo para instalar."));
  updCheck();
}
function renderUpd(){

      <p class="lede" style="margin:0 0 8px">${L("Download the new DATA-LIZ-MODULE.html from Claude into Downloads and press Install.","Descarga el DATA-LIZ-MODULE.html nuevo desde Claude a Descargas y presiona Instalar.")}</p>
      <div class="row-v"><span>${L("This version","Esta versión")}</span><b>${esc(MOD_BUILD)}</b></div>
      ${i ? (i.ok ? row("DATA-LIZ MODULE", m) + row(L("Link (launcher)","Enlace (launcher)"), l) : `<div class="row-v bad"><span>${L("DATA-LIZ link","Enlace de DATA-LIZ")}</span><b>${L("not running","no está corriendo")}</b></div>`) : ""}
      <div class="toolbar" style="margin:12px 0 0"><button class="btn ghost" id="updChk">${L("Check for updates","Buscar actualizaciones")}</button>

      const b = r.data.split(" ").map(h => parseInt(h, 16));
      SWITCHES.forEach((sw, i) => {
        if(sw[0] !== r.pgn) return;
        const v = (b[sw[1]-1] >> (sw[2]-1)) & 3; if(v === 3) return;
        const prev = seen.get(i); if(!prev || (r.sa === 0 && prev.sa !== 0)) seen.set(i, {v, sa:r.sa});
      });
    }
    const list = [...seen.entries()].sort((a, b) => a[0] - b[0]);
    if(!list.length) swBox.innerHTML = `<p class="cl-note" style="margin:0">${connected ? L("No standard switches on this truck yet.","Este camión todavía no manda switches estándar.") : "—"}</p>`;
    else {
      const key = list.map(([i]) => i).join(",");
      if(swBox.dataset.key !== key || swBox.dataset.lang !== LANG){
        swBox.dataset.key = key; swBox.dataset.lang = LANG;
        swBox.innerHTML = list.map(([i]) => `<div class="swl" id="swl-${i}"><i></i><div><span>${esc(swName(SWITCHES[i]))}</span><small></small></div></div>`).join("");
      }
      for(const [i, x] of list){
        const el = $("#swl-" + i); if(!el) continue;
        const st = x.v === 1 ? "on" : x.v === 2 ? "err" : "off";
        if(el.dataset.st && el.dataset.st !== st){ el.classList.remove("chg"); void el.offsetWidth; el.classList.add("chg"); }
        el.dataset.st = st;
        el.querySelector("small").textContent = x.v === 1 ? L("ON","ACTIVO") : x.v === 2 ? "ERROR" : L("off","apagado");
      }
    }
  }
  const hrs = numVal(65253, 247), dist = numVal(65248, 245) || numVal(65217, 917), ft = numVal(65262, 174);
  $("#odo-h").textContent = hrs ? fmt(hrs.v, "h") : (bridgeFresh() && bridge.vals["Horas motor"]) || "—";
  $("#odo-d").textContent = dist ? fmt(dist.v, "km") : (bridgeFresh() && bridge.vals["Distancia"]) || "—";
  $("#odo-ft").textContent = ft ? fmt(ft.v, "°C") : (bridgeFresh() && bridge.vals["Temp. comb."]) || "—";
  $("#clNote").textContent = !connected ? L("Not connected: connect the DATA-LIZ module to see the gauges move.","Sin conectar: conecta el módulo DATA-LIZ para ver moverse los relojes.")
    : !any ? L("Waiting for engine data… Key ON (engine running for oil pressure and boost).","Esperando datos del motor… Llave en ON (motor encendido para presión de aceite y turbo).") : "";
}

// Respuestas del módulo para motor y fallas (se llama desde handleLine)
function engLine(line){
  let m;
  if((m = line.match(/^Puente: (ON|OFF) \| SA/))){ bridge = {vals:{}, faults:[], lamps:null, t:bridge.t}; collectingBridge = true; return false; }
  if(collectingBridge){
    if((m = line.match(/^\s{2}(RPM|Carga|Acelerador|Refrigerante|Temp\. aceite|Pres\. aceite|Nivel aceite|Nivel refrig|Bateria|Velocidad|Temp\. comb\.|Temp\. aire|Consumo|Distancia|Horas motor)\s+(.+)$/))){ bridge.vals[m[1]] = m[2].trim(); bridge.t = Date.now(); BUS.j1708 = Date.now(); return true; }
    if((m = line.match(/Lamparas ECM: ambar (\S+), roja (\S+), protect (\S+)/))){ bridge.lamps = {awl:m[1] === "ON", rsl:m[2] === "ON", pl:m[3] === "ON"}; return true; }
    if((m = line.match(/SPN (\d+) FMI (\d+) \(x(\d+)\)/))){ bridge.faults.push({spn:m[1], fmi:m[2], oc:m[3]}); return true; }
    if(/Fallas activas: 0/.test(line)){ bridge.faults = []; return true; }
  }
  if((m = line.match(/^\[ID\] PGN (\d+) SA (\d+) (.*)$/))){ ids[`${m[1]}-${m[2]}`] = m[3]; BUS.j1939 = Date.now(); return true; }
  if(/^\[ID\] ERROR/.test(line)){ ENG.fltMsg = L("The module is listen-only: it can't ask for the ID. Turn the bridge on (Settings) and try again.","El módulo está en solo escucha: no puede pedir la identificación. Enciende el puente (Configuración) y vuelve a intentar."); return true; }
  if((m = line.match(/^\[DM\] PGN (\d+) SA (\d+)((?: [0-9A-F]{2})+)$/i))){ dmData[`${m[1]}-${m[2]}`] = {bytes: m[3].trim().split(" ").map(h => parseInt(h, 16)), t: Date.now()}; BUS.j1939 = Date.now(); return true; }
  if(/^\[DM\] ERROR/.test(line)){ ENG.fltMsg = L("The module is listen-only: active faults (DM1) still arrive, but it can't ask for previous faults or clear them. Turn the bridge on (Settings) and wait for the network.","El módulo está en solo escucha: las fallas activas (DM1) sí llegan, pero no puede pedir las previas ni borrarlas. Enciende el puente (Configuración) y espera la red."); return true; }
  if(/^\[DM\] (pedido|borrado) enviado/.test(line)) return true;
  if((m = line.match(/^\[J1587DM\] MID\s+(\d+):((?: [0-9A-Fa-f]{2})*)\s*$/))){ j1587Dm[+m[1]] = {bytes: m[2].trim() ? m[2].trim().split(/\s+/).map(h => parseInt(h, 16)) : [], t: Date.now()}; BUS.j1708 = Date.now(); return true; }
  if((m = line.match(/^\[ACK\] SA (\d+) PGN (\d+) (\S+)/))){
    const res = {ACK:L("done","hecho"), NACK:L("refused","rechazado"), DENIED:L("access denied","acceso denegado"), BUSY:L("busy, try again","ocupado, intenta de nuevo")}[m[3]] || m[3];
    ENG.fltMsg = `${saName(+m[1])}: ${L("clear","borrado")} → ${res}`; return true;
  }
  return false;
}

// ================= BLUETOOTH (BLE, servicio UART de Nordic) — firmware v2.17 =================
// Funciona en Chrome de Android, Edge/Chrome de Windows y en iPhone con la app Bluefy.
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e", NUS_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e", NUS_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const BLE = {dev:null, rx:null, q:Promise.resolve(), busy:false};
const hasBle = () => !!(navigator.bluetooth && navigator.bluetooth.requestDevice);
function bleWrite(text){
  const data = new TextEncoder().encode(text + "\n");
  BLE.q = BLE.q.then(async () => {
    for(let i = 0; i < data.length; i += 20){
      if(!BLE.rx) return;
      const part = data.slice(i, i + 20);
      if(BLE.rx.writeValueWithResponse) await BLE.rx.writeValueWithResponse(part); else await BLE.rx.writeValue(part);
    }
  }).catch(e => { toast(L("Could not send by Bluetooth: ","No se pudo enviar por Bluetooth: ") + e.message); });
}
async function bleConnect(){
  if(!hasBle()){ showDone(L("No Bluetooth here","Sin Bluetooth aquí"), L("This browser can't use Bluetooth. On Android use Chrome; on iPhone use the Bluefy app.","Este navegador no puede usar Bluetooth. En Android usa Chrome; en iPhone usa la app Bluefy.")); return; }
  if(connected){ toast(L("Disconnect first.","Primero desconecta.")); return; }
  BLE.busy = true;   // mientras se conecta por Bluetooth, no se conecta solo por USB
  let dev;
  try {
    dev = await navigator.bluetooth.requestDevice({filters:[{namePrefix:"DATA-LIZ"}, {services:[NUS]}], optionalServices:[NUS]});
  } catch(e){ BLE.busy = false; if(e.name !== "NotFoundError") toast(e.message); return; }
  $("#netText").textContent = L("Connecting by Bluetooth…","Conectando por Bluetooth…");
  try {
    dev.addEventListener("gattserverdisconnected", () => {
      if(BLE.dev !== dev) return;
      BLE.dev = null; BLE.rx = null; beforeDisconnect(); buf = ""; setConnected(false);
      toast(L("Bluetooth disconnected.","Bluetooth desconectado."));
    });
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService(NUS);
    const tx = await svc.getCharacteristic(NUS_TX);
    BLE.rx = await svc.getCharacteristic(NUS_RX);
    const dec = new TextDecoder();
    tx.addEventListener("characteristicvaluechanged", e => { buf += dec.decode(e.target.value, {stream:true}); pump(); });
    await tx.startNotifications();        // si el módulo tiene clave, aquí el celular pide el PIN
    if(connected) await disconnect();      // por si el USB se conectó mientras tanto
    BLE.dev = dev; BLE.q = Promise.resolve(); BLE.busy = false; buf = "";
    setConnected(true, "Bluetooth · " + (dev.name || "DATA-LIZ"));
    toast(L("Connected by Bluetooth.","Conectado por Bluetooth."));
  } catch(e){
    try { dev.gatt.disconnect(); } catch(x){}
    BLE.dev = null; BLE.rx = null; BLE.busy = false; setConnected(false);
    showDone(L("Bluetooth did not connect","No conectó por Bluetooth"),
      L("Check that the module has firmware v2.17 or newer, the key is ON and you are close to the truck. If it asks for a PIN, the factory PIN is 123456.\n\n","Revisa que el módulo tenga el firmware v2.17 o más nuevo, la llave en ON y que estés cerca del camión. Si pide clave (PIN), la de fábrica es 123456.\n\n") + e.message);
  }
}
$("#btnBle").onclick = () => { if(connected && BLE.dev){ userStopped = true; disconnect(); } else bleConnect(); };
// En el celular (sin puerto USB) solo se muestra Bluetooth
if(!("serial" in navigator) && location.protocol !== "file:") $("#btnConnect").hidden = true;
// App instalable en el celular (solo cuando la página está en internet con https)
if(location.protocol === "https:"){
  const m = document.createElement("link"); m.rel = "manifest"; m.href = "manifest.webmanifest"; document.head.appendChild(m);
  const a = document.createElement("link"); a.rel = "apple-touch-icon"; a.href = "icon-192.png"; document.head.appendChild(a);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}

// ================= pestañas y sondeo =================
const TABS = {out:["Outputs","Salidas"], red:["CAN network","Red CAN"], eng:["Engine","Motor"], flt:["Fault codes","Fallas"], cfg:["Settings","Configuración"], con:["Console","Consola"]};
document.querySelectorAll("nav button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
function showTab(t){
  const was = tab; tab = t;
  try { localStorage.setItem("dlm-tab", t); } catch(e){}
  if(was === "con" && t !== "con" && connected){ if(SNF.j1939) send("SNIFF OFF"); if(SNF.j1708) send("J1708 SNIFF OFF"); SNF.j1939 = SNF.j1708 = SNF.paused = false; }
  if(was === "red" && t !== "red" && detect.on) stopDetect();
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === t ? "true" : "false"));
  document.querySelectorAll("main > section").forEach(s => s.hidden = s.id !== "tab-" + t);
  renderTab(); enterTab(t);
}
function enterTab(t){
  if(!connected) return;
  if(t === "out"){ send("STATUS"); }
  if(t === "red"){ send("LIST"); setTimeout(() => send("SCAN"), 250); }
  if(t === "eng"){ send("SCAN"); setTimeout(() => send("BSTATUS"), 250); if(!currentVin() && Date.now() - ENG.lastIdReq > 30000){ ENG.lastIdReq = Date.now(); setTimeout(() => send("IDREQ"), 500); } }
  if(t === "flt"){ readFaults(); }
  if(t === "cfg"){ send("LIST"); setTimeout(() => send("BSTATUS"), 250); TX.t = 0; TX.asked = 0; txAsk(); }
  if(t === "cfg"){ fwInfo(); updCheck(); }
}
function renderTab(){
  if(tab === "out"){ renderOutHead(); renderRack(); }
  if(tab === "red"){ renderRedTop(); renderRed(true); }
  if(tab === "cfg"){ renderCfg(); if(!FW.info) fwInfo(); }
  if(tab === "con") renderConTop();
  if(tab === "eng") renderEng(true);
  if(tab === "flt"){ $("#fltBox").innerHTML = ""; renderFlt(); }
}
function renderAll(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("nav button").forEach(b => b.querySelector("span").textContent = L(...TABS[b.dataset.tab]));
  $("#hello").innerHTML = ("serial" in navigator || location.protocol === "file:" ? L("Plug the module in over USB and press <b>Connect module</b>, or press <b>Bluetooth</b> to connect without a cable. Close DATA-LIZ first: only one program can use the module at a time.",
                            "Conecta el módulo por USB y presiona <b>Conectar módulo</b>, o presiona <b>Bluetooth</b> para conectarte sin cable. Cierra DATA-LIZ antes: solo un programa puede usar el módulo a la vez.")
    : L("Turn the key ON, stay close to the truck and press <b>Bluetooth</b>. The first time, the phone asks for the module PIN (factory: 123456).","Pon la llave en ON, quédate cerca del camión y presiona <b>Bluetooth</b>. La primera vez el celular pide la clave del módulo (de fábrica: 123456)."));
  $("#hello").hidden = connected;
  $("#btnConnect").textContent = connected ? L("Disconnect","Desconectar") : L("Connect module","Conectar módulo");
  $("#btnBle").hidden = !hasBle() || (connected && !BLE.dev);
  $("#btnConnect").hidden = (connected && !!BLE.dev) || (!("serial" in navigator) && location.protocol !== "file:");
  $("#btnBle").textContent = connected && BLE.dev ? L("Disconnect","Desconectar") : "Bluetooth";
  $("#btnBle").className = "btn " + (connected && BLE.dev ? "ghost" : "primary");
  if(!connected) $("#netText").textContent = L("Not connected","Sin conectar");
  renderTab();
}
function txAsk(){ if(tab !== "cfg" || !connected) return; TX.asked = TX.asked || Date.now(); send("TXLIST"); }
setInterval(txAsk, 1500);
setInterval(() => { if(tab === "cfg" && !TX.t) renderBridge(); }, 2000);
setInterval(() => {
  if(!connected || learning || FW.busy) return;
  if(tab === "out"){ send("STATUS"); }
  else if(tab === "red"){ send("SCAN"); }
  else if(tab === "cfg"){ send("BSTATUS"); }
  else if(tab === "flt"){ send("BSTATUS"); }
}, 2000);
// Motor: datos rápidos (1 s) y puente J1708 cada 2 s
let engTick = 0, engSec = 0;
setInterval(() => {
  if(!connected || learning || FW.busy || tab !== "eng") return;
  if(BLE.dev && (engSec++ % 2)) return;          // por Bluetooth, cada 2 s (mueve menos datos)
  send("SCAN"); if(++engTick % 2 === 0) setTimeout(() => send("BSTATUS"), 300);
}, 1000);
setInterval(() => { if(connected && !learning && tab !== "out" && tab !== "con") send("STATUS"); }, 8000);
$("#langSel").value = LANG;
$("#langSel").onchange = e => { LANG = e.target.value; try { localStorage.setItem("lizdata-lang", LANG); } catch(x){} renderAll(); };
{ let t0 = "out"; try { const s = localStorage.getItem("dlm-tab"); if(TABS[s]) t0 = s; } catch(e){} renderAll(); showTab(t0); }
if(!("serial" in navigator) && location.protocol === "file:") $("#hello").innerHTML += "<br>" + L("Open this file in Microsoft Edge or Chrome.","Abre este archivo en Microsoft Edge o Chrome.");
</script>
